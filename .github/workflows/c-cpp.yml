name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        # policy-rc.d stops apt from auto-starting redis-server on port 6379 (already taken by the container)
        echo '#!/bin/sh' | sudo tee /usr/sbin/policy-rc.d >/dev/null
        echo 'exit 101' | sudo tee -a /usr/sbin/policy-rc.d >/dev/null
        sudo chmod +x /usr/sbin/policy-rc.d
        sudo apt-get install -y libmysqlclient-dev mysql-client redis-tools redis-server libgtest-dev libgmock-dev

    - name: Configure (Debug, tests on)
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_TESTS=ON

    - name: Build
      run: cmake --build build --parallel 4

    - name: Start Kafka
      run: |
        # --pid=host: ClusterChaosProcess kp7 needs the broker java process visible
        # to host pgrep for SIGSTOP/SIGCONT.
        # KAFKA_* env vars are converted to server.properties by the image
        # (dots <-> underscores). No file mount: a root-owned read-only file
        # breaks the appuser configure step.
        docker run -d --name kafka --pid=host \
          -p 9092:9092 \
          -e KAFKA_NODE_ID=1 \
          -e KAFKA_PROCESS_ROLES=broker,controller \
          -e KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093 \
          -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092 \
          -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@127.0.0.1:9093 \
          -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
          -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
          -e KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
          -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
          -e KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS=1 \
          -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
          -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
          -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
          apache/kafka:latest
    - name: Wait for Kafka readiness
      run: |
        # Host-side TCP probe (same idiom as tests/scripts) + broker log check.
        for i in $(seq 1 60); do
          if (exec 3<>/dev/tcp/127.0.0.1/9092) 2>/dev/null; then
            started=$(docker logs kafka 2>&1 | grep -c "Kafka Server started" || true)
            if [ "$started" -ge 1 ]; then
              echo "kafka ready (try $i)"
              exit 0
            fi
          fi
          sleep 5
        done
        echo "kafka not ready in time; last logs:"
        docker logs kafka 2>&1 | tail -60
        exit 1

    - name: Warm up Kafka group coordinator
      run: |
        # A fresh broker lazily creates __consumer_offsets on the first group
        # operation; until then the coordinator returns errors and the
        # production KafkaEventConsumer poll has zero tolerance for them.
        # Trigger creation and wait for the group path to become usable.
        # NOTE: scripts are NOT on the exec PATH; use /opt/kafka/bin absolute paths.
        docker exec kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list
        docker exec kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 \
          --create --topic ci-coordinator-warmup --partitions 1 --replication-factor 1 || true
        echo "warmup" | docker exec -i kafka /opt/kafka/bin/kafka-console-producer.sh \
          --bootstrap-server 127.0.0.1:9092 --topic ci-coordinator-warmup
        for i in 1 2 3 4 5 6; do
          if docker exec kafka /opt/kafka/bin/kafka-console-consumer.sh \
              --bootstrap-server 127.0.0.1:9092 --topic ci-coordinator-warmup \
              --from-beginning --max-messages 1 --group ci-warmup --timeout-ms 30000; then
            echo "group coordinator warm (try $i)"
            exit 0
          fi
          echo "coordinator not ready yet (try $i)"
          sleep 5
        done
        echo "coordinator warmup failed"
        exit 1

    - name: Test
      env:
        DB_PASSWORD: 123456
        MYSQL_HOST: 127.0.0.1
      run: ctest --test-dir build --output-on-failure
