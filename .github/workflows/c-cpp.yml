name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libmysqlclient-dev mysql-client redis-tools libgtest-dev libgmock-dev

    - name: Configure (Debug, tests on)
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_TESTS=ON

    - name: Build
      run: cmake --build build --parallel 4

    - name: Start Kafka
      run: |
        # --pid=host: ClusterChaosProcess kp7 需要从宿主 PID 命名空间 pgrep 到 broker 的 java 进程做 SIGSTOP/SIGCONT
        # apache/kafka 镜像把 KAFKA_* 环境变量转换为 server.properties（点号<->下划线）；
        # 不用文件挂载（root 属主只读文件会让 appuser 的 configure 步骤写失败）
        docker run -d --name kafka --pid=host \
          -p 9092:9092 \
          -e KAFKA_NODE_ID=1 \
          -e KAFKA_PROCESS_ROLES=broker,controller \
          -e KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093 \
          -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092 \
          -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@127.0.0.1:9093 \
          -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
          -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
          -e KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
          -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
          -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
          -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
          -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
          apache/kafka:latest

    - name: Wait for Kafka readiness
      run: |
        for i in $(seq 1 60); do
          if docker exec kafka kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1; then
            echo "kafka ready (try $i)"
            exit 0
          fi
          if [ $((i % 6)) -eq 0 ]; then
            echo "--- try $i: kafka container status ---"
            docker ps -a --filter name=kafka --format "{{.Status}}"
            docker logs kafka 2>&1 | tail -15 || true
          fi
          sleep 5
        done
        echo "kafka not ready in time; full logs:"
        docker logs kafka 2>&1 | tail -100
        exit 1

    - name: Test
      env:
        DB_PASSWORD: 123456
      run: ctest --test-dir build --output-on-failure
