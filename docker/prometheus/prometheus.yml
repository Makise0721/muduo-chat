# P5-01 实验 SLO 观测面：scrape P5-00 /metrics 端点 + 告警规则引用（docker/ 部署
# 文件，不进生产代码）。experimental SLO：无真实流量前不构成任何 SLA/生产承诺。
#
# 约定（docs/tasks/P5-01.md 设计决定 D3，冻结）：
#   - 目标 = 宿主 loopback 的 P5-00 /metrics 端口（卡内约定 9095，验证时显式
#     metrics.enabled=true + metrics.port=9095）。
#   - metrics_path=/metrics，scrape_interval=5s（对齐 P5-00 runEvery 1s 采样并留余量）。
#   - honor_labels=true（保留目标自带 label）。
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: chat_metrics
    honor_labels: true
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:9095"]
