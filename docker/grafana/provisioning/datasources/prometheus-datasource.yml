# P5-01 Grafana provisioning：Prometheus 数据源自动加载（docker/ 部署文件）。
# 与 prometheus scrape 目标一致，指向宿主 loopback 的 prometheus（host 网络共享
# loopback）。experimental 观测面，无生产承诺。
apiVersion: 1

datasources:
  - name: prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
